name: Update ETF Data

on:
  # 支持手动在 GitHub Actions 页面或通过 API 触发，并接受输入参数
  workflow_dispatch:
    inputs:
      strategy:
        description: '运行策略 (all / etf / whitehorse / us_stock)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - etf
          - whitehorse
          - us_stock
      date:
        description: '查询日期 YYYY-MM-DD（留空=今天）'
        required: false
        default: ''
        type: string

  # 自动定时刷新：每天北京时间周一至周五 15:15 分运行 (UTC 07:15)
  schedule:
    - cron: '15 7 * * 1-5'

jobs:
  update-etf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. 检出 my_website 仓库的代码
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. 配置 Python 3.10 环境
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 安装脚本执行所需的依赖库
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests mootdx yfinance

    # 4. 执行 ETF 动量选股策略
    - name: Run ETF Quant Model
      if: ${{ github.event.inputs.strategy == '' || github.event.inputs.strategy == 'all' || github.event.inputs.strategy == 'etf' }}
      run: |
        DATE_ARG=""
        if [ -n "${{ github.event.inputs.date }}" ]; then
          DATE_ARG="--date ${{ github.event.inputs.date }}"
        fi
        python scripts/quantum_etf_dingtalk.py --once --no-publish $DATE_ARG

    # 5. 执行白马股均值回归监控策略
    - name: Run Whitehorse Model
      if: ${{ github.event.inputs.strategy == '' || github.event.inputs.strategy == 'all' || github.event.inputs.strategy == 'whitehorse' }}
      env:
        DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      run: |
        DATE_ARG=""
        if [ -n "${{ github.event.inputs.date }}" ]; then
          DATE_ARG="--date ${{ github.event.inputs.date }}"
        fi
        python scripts/quantum_etf_whitehorse.py --no-publish $DATE_ARG

    # 6. 执行美股监控策略
    - name: Run US Stock Model
      if: ${{ github.event.inputs.strategy == '' || github.event.inputs.strategy == 'all' || github.event.inputs.strategy == 'us_stock' }}
      env:
        DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      run: |
        DATE_ARG=""
        if [ -n "${{ github.event.inputs.date }}" ]; then
          DATE_ARG="--date ${{ github.event.inputs.date }}"
        fi
        python scripts/quantum_us_stock.py $DATE_ARG

    # 7. 自动提交并推送到 GitHub 仓库 (统一推送所有变更)
    - name: Commit and Push Data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        git commit -m "Auto-update quant data for $(date +'%Y-%m-%d')" || exit 0
        git pull --rebase origin main
        git push
